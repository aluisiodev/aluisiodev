name: Atualizar README

on:
  push:
    branches:
      - main
  schedule:
    # roda todo dia as 04:00 UTC (01:00 no horario de Brasilia)
    - cron: "0 4 * * *"
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cache/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r cache/requirements.txt

      - name: Atualizar os SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
          BIRTHDAY: ${{ secrets.BIRTHDAY }}
        run: python today.py

      - name: Commitar alteracoes
        run: |-
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "README atualizado" -a || echo "Nada para commitar"
          git push
